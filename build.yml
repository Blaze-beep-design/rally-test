           if(S==='count'){for(let k=0;k<3;k++)ls[k].className=k<n?'r':'';if(n>lastN){lastN=n;sfx.beep()}if(cT>=4){for(const l of ls)l.className='g';S='race';sfx.go();music('race');say("Go go go! Nice and smooth")}}
           if(cT>=5.5)ui(['lights'],0)}
