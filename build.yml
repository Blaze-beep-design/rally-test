          look+=(lookT-look)*Math.min(1,rdt*10);lookP+=(lookPT-lookP)*Math.min(1,rdt*10);if(lkId===null){lookT*=Math.exp(-2.5*rdt);lookPT*=Math.exp(-2.5*rdt)}
