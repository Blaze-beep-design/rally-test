name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project and game files
        run: |
          mkdir -p src/main/java/com/rally/test src/main/assets
          cat > settings.gradle <<'EOF_SETTINGS'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'RallyTest'
          EOF_SETTINGS
          cat > build.gradle <<'EOF_BUILD'
          plugins { id 'com.android.application' version '8.5.2' }
          android {
              namespace 'com.rally.test'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.rally.test'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '0.1'
              }
          }
          EOF_BUILD
          cat > src/main/AndroidManifest.xml <<'EOF_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Rally Test"
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_MANIFEST
          cat > src/main/java/com/rally/test/MainActivity.java <<'EOF_JAVA'
          package com.rally.test;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = getWindow().getAttributes();
                      lp.layoutInDisplayCutoutMode = WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      getWindow().setAttributes(lp);
                  }
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setOverScrollMode(View.OVER_SCROLL_NEVER);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean focus) {
                  super.onWindowFocusChanged(focus);
                  if (focus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
                  }
              }

              @Override protected void onPause() { super.onPause(); web.onPause(); }
              @Override protected void onResume() { super.onResume(); web.onResume(); }
              @Override protected void onDestroy() { web.destroy(); super.onDestroy(); }
          }
          EOF_JAVA
          for f in menu race; do [ -f $f.mp3 ] && cp $f.mp3 src/main/assets/$f.mp3; done; true
          # >>>>>>>>>> GAME CODE (index.html) STARTS HERE <<<<<<<<<<
          cat > src/main/assets/index.html <<'EOF_GAME'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
          <meta name="mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
          <title>Rally Test</title>
          <style>
          html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,sans-serif;color:#fff}
          canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
          .ab{position:fixed}.hide{display:none!important}
          #top{top:1.2vh;left:0;right:0;text-align:center;pointer-events:none}
          #tm{font:700 6.5vh monospace;text-shadow:0 0 8px #000,0 0 3px #000}
          #pen{display:inline-block;margin-left:2vh;font:700 5vh monospace;color:#ff3b2f;opacity:0;transition:opacity .4s;text-shadow:0 0 6px #000}
          #note{top:25vh;left:50%;transform:translateX(-50%);padding:.8vh 2.4vh;background:rgba(0,0,0,.5);border-radius:1vh;color:#ffe9a8;font:600 3.6vh system-ui;opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none}
          #lights{top:15vh;left:50%;transform:translateX(-50%);pointer-events:none;white-space:nowrap}
          #lights i{display:inline-block;width:6vh;height:6vh;margin:0 1vh;border-radius:50%;background:#2a0a0a;border:.5vh solid #000}
          #lights i.r{background:#f21;box-shadow:0 0 2vh #f21}#lights i.g{background:#2f4;box-shadow:0 0 2vh #2f4}
          .pad{position:fixed;border-radius:2vh;display:flex;align-items:center;justify-content:center;font:700 3.2vh system-ui;background:rgba(255,255,255,.14);border:.4vh solid rgba(255,255,255,.4);text-shadow:0 0 4px #000}
          .pad.on{background:rgba(255,255,255,.38)}
          #gas{right:3vw;bottom:5vh;width:17vw;height:38vh;background:rgba(40,200,80,.25)}
          #brk{right:21vw;bottom:5vh;width:14vw;height:24vh;background:rgba(230,50,40,.25)}
          #hb{right:21vw;bottom:31vh;width:14vw;height:13vh;background:rgba(255,150,20,.25)}
          #steer{left:3vw;bottom:5vh;width:38vw;height:26vh;background:rgba(255,255,255,.08)}
          #rail{position:absolute;left:8%;right:8%;top:50%;height:.8vh;margin-top:-.4vh;background:rgba(255,255,255,.35);border-radius:1vh}
          #knob{position:absolute;top:50%;left:50%;width:11vh;height:11vh;margin:-5.5vh 0 0 -5.5vh;border-radius:50%;background:rgba(255,255,255,.5);border:.5vh solid #fff}
          #menu{inset:0;background:linear-gradient(180deg,rgba(0,0,0,.65),rgba(0,0,0,.2));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
          #menu h1{margin:0;font:900 12vh Impact,'Arial Narrow Bold',sans-serif;letter-spacing:.5vh;transform:skew(-8deg);text-shadow:.6vh .6vh 0 #d9540f}
          #menu p{margin:0;font-size:3vh;opacity:.8}
          #play{font:800 5vh system-ui;padding:1.6vh 10vh;border:0;border-radius:1.6vh;background:#d9540f;color:#fff}
          #play:active{background:#ff7a2a}
          #res{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.35);text-align:center}
          #res b{font:900 11vh Impact,sans-serif;color:#ffe9a8}#res span{font:700 5vh monospace;line-height:1.4}
          #rot{inset:0;z-index:99;background:#000;display:none;align-items:center;justify-content:center;font:700 4vw system-ui;text-align:center}
          @media (orientation:portrait){#rot{display:flex}}
          #icons{top:11vh;left:0;right:0;display:flex;justify-content:center;gap:1.2vh;pointer-events:none;opacity:0;transition:opacity .3s}#icons canvas{width:12vh;height:12vh;filter:drop-shadow(0 0 .6vh #000)}#look{top:12vh;left:0;right:0;bottom:33vh}
          </style></head><body>
          <canvas id="g"></canvas><canvas id="cock" class="hide"></canvas>
          <div id="top" class="ab hide"><span id="tm">00:00.0</span><span id="pen"></span></div>
          <div id="icons" class="ab"></div><div id="note" class="ab"></div>
          <div id="lights" class="ab hide"><i></i><i></i><i></i></div>
          <div id="look" class="ab hide"></div><div id="steer" class="pad hide"><div id="rail"></div><div id="knob"></div></div>
          <div id="gas" class="pad hide">GAS</div><div id="brk" class="pad hide">BRAKE</div><div id="hb" class="pad hide">HANDBRAKE</div>
          <div id="res" class="ab hide"></div>
          <div id="menu" class="ab"><h1>RALLY TEST</h1><p>Dev build 0.1 · hold landscape</p><button id="play">PLAY</button></div>
          <div id="rot">Rotate your phone to landscape</div>
          <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
          <script>
          const $=id=>document.getElementById(id);
          const R=new THREE.WebGLRenderer({canvas:$('g'),antialias:false});
          const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fb0b8);scene.fog=new THREE.Fog(0x9fb0b8,70,430);
          const cam=new THREE.PerspectiveCamera(72,1,.1,600);
          scene.add(new THREE.HemisphereLight(0xe6eef5,0x4a5a35,.95));
          const sun=new THREE.DirectionalLight(0xffeedd,.7);sun.position.set(100,200,60);scene.add(sun);
          const cx=$('cock'),c2=cx.getContext('2d');
          function resize(){const w=innerWidth,h=innerHeight,r=Math.min(devicePixelRatio||1,2);R.setPixelRatio(r);R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();cx.width=w*r;cx.height=h*r}
          addEventListener('resize',resize);resize();

          /* ---------- TRACK ---------- */
          const ctrl=[[0,0],[0,-220],[70,-400],[210,-470],[370,-420],[440,-290],[380,-170],[260,-110],[210,0],[270,110],[410,165],[570,130],[660,240],[630,390],[490,455],[340,435],[260,530],[290,650],[430,710],[560,700]].map(p=>new THREE.Vector3(p[0],0,p[1]));
          const curve=new THREE.CatmullRomCurve3(ctrl,false,'centripetal');
          const L=curve.getLength(),STEP=1.5,N=Math.floor(L/STEP),sp=curve.getSpacedPoints(N);
          const PX=[],PZ=[],TX=[],TZ=[],BY=[],RP=[],Y=[];
          for(let i=0;i<=N;i++){PX[i]=sp[i].x;PZ[i]=sp[i].z}
          for(let i=0;i<=N;i++){const a=Math.max(0,i-1),b=Math.min(N,i+1);let x=PX[b]-PX[a],z=PZ[b]-PZ[a];const m=Math.hypot(x,z)||1;TX[i]=x/m;TZ[i]=z/m}
          let pv=0;for(let i=0;i<=N;i++){let a=Math.atan2(-TX[i],-TZ[i]);if(i){while(a-pv>Math.PI)a-=2*Math.PI;while(a-pv<-Math.PI)a+=2*Math.PI}Y[i]=a;pv=a}
          for(let i=0;i<=N;i++){const s=i*STEP;BY[i]=6*Math.sin(s*.0045)+3*Math.sin(s*.013+1)}
          const b0=BY[0];for(let i=0;i<=N;i++)BY[i]-=b0;
          // jumps: put them on the straightest bit near these fractions
          const ramps=[.5,.78].map(f=>{let best=0,bv=9;const c=Math.floor(f*N);for(let i=c-120;i<c+120;i++){const v=Math.abs(Y[i+30]-Y[i-5]);if(v<bv){bv=v;best=i}}return best});
          for(let i=0;i<=N;i++){let r=0;for(const rs of ramps){const u=(i-rs)*STEP;if(u>0&&u<16)r+=2.4*u/16;else if(u>=16&&u<18)r+=2.4*(1-(u-16)/2)}RP[i]=r}
          const sm=(d,a,b)=>{const t=Math.min(1,Math.max(0,(d-a)/(b-a)));return t*t*(3-2*t)};
          const nz=(x,z)=>Math.sin(x*.02)*Math.cos(z*.017)*9+Math.sin(x*.06+z*.045)*2.5+Math.cos(z*.035-x*.02)*3;
          const terr=(x,z,i,d)=>BY[i]-.3+nz(x,z)*sm(d,7,50);
          function ground(x,z,i,d,f=0,j=i){const hb=BY[i]+(BY[j]-BY[i])*f,hr=RP[i]+(RP[j]-RP[i])*f;if(d<4.3)return hb+hr;const t=hb-.3+nz(x,z)*sm(d,7,50);if(d<6.2){const u=(d-4.3)/1.9;return(hb+hr)*(1-u)+t*u}return t}
          function nearAll(x,z){let b=0,bd=1e12;for(let i=0;i<=N;i++){const dx=x-PX[i],dz=z-PZ[i],dd=dx*dx+dz*dz;if(dd<bd){bd=dd;b=i}}return[b,Math.sqrt(bd)]}
          let NF=0,NJ=0;
          function near(x,z,h){let b=h,bd=1e12;const lo=Math.max(0,h-40),hi=Math.min(N,h+40);for(let i=lo;i<=hi;i++){const dx=x-PX[i],dz=z-PZ[i],dd=dx*dx+dz*dz;if(dd<bd){bd=dd;b=i}}
          const dx=x-PX[b],dz=z-PZ[b],u=(dx*TX[b]+dz*TZ[b])/STEP;NJ=Math.max(0,Math.min(N,b+(u>0?1:-1)));NF=Math.min(1,Math.abs(u));return[b,Math.abs(-dx*TZ[b]+dz*TX[b])]}

          /* terrain */
          {let mnx=1e9,mxx=-1e9,mnz=1e9,mxz=-1e9;for(let i=0;i<=N;i++){mnx=Math.min(mnx,PX[i]);mxx=Math.max(mxx,PX[i]);mnz=Math.min(mnz,PZ[i]);mxz=Math.max(mxz,PZ[i])}
          mnx-=160;mxx+=160;mnz-=160;mxz+=160;const SX=100,SZ=100;
          const g=new THREE.PlaneGeometry(mxx-mnx,mxz-mnz,SX,SZ);g.rotateX(-Math.PI/2);
          const p=g.attributes.position,cols=new Float32Array(p.count*3),cx0=(mnx+mxx)/2,cz0=(mnz+mxz)/2;
          for(let k=0;k<p.count;k++){const x=p.getX(k)+cx0,z=p.getZ(k)+cz0,[i,d]=nearAll(x,z);p.setXYZ(k,x,terr(x,z,i,d),z);
          const n=Math.sin(x*.11)*Math.cos(z*.13)*.5+.5,dirt=1-sm(d,6,12);
          cols[k*3]=(.30+.12*n)*(1-dirt)+.55*dirt;cols[k*3+1]=(.48+.1*n)*(1-dirt)+.42*dirt;cols[k*3+2]=(.22+.05*n)*(1-dirt)+.28*dirt}
          g.setAttribute('color',new THREE.BufferAttribute(cols,3));g.computeVertexNormals();
          scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true})))}

          /* road */
          {const v=[],c=[],ix=[];for(let i=0;i<=N;i++){const rx=-TZ[i],rz=TX[i],y=BY[i]+RP[i]+.06,sh=(Math.floor(i/6)%2)*.04;
          for(const sd of[-1,1]){v.push(PX[i]+rx*4*sd,y,PZ[i]+rz*4*sd);c.push(.62+sh,.52+sh,.38+sh)}}
          for(let i=0;i<N;i++){const a=2*i,b=a+1,cc=a+2,d=a+3;ix.push(a,b,cc,b,d,cc)}
          const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('color',new THREE.Float32BufferAttribute(c,3));g.setIndex(ix);g.computeVertexNormals();
          scene.add(new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide})))}

          /* poles + trees */
          const D=new THREE.Object3D();
          const poles=[];let pole;{pole=new THREE.InstancedMesh(new THREE.BoxGeometry(.25,1.6,.25).translate(0,.8,0),new THREE.MeshLambertMaterial({color:0xff7a1a}),((N/8)+2|0)*2);let c=0;
          for(let i=0;i<=N;i+=8)for(const sd of[-1,1]){const x=PX[i]-TZ[i]*sd*5.2,z=PZ[i]+TX[i]*sd*5.2;const y0=ground(x,z,i,5.2);D.position.set(x,y0,z);D.updateMatrix();poles.push({x,z,y:y0,a:0,v:0,ax:0,az:0,h:0});pole.setMatrixAt(c++,D.matrix)}
          pole.count=c;scene.add(pole);
          const tm=new THREE.InstancedMesh(new THREE.ConeGeometry(2,7,6).translate(0,3.5,0),new THREE.MeshLambertMaterial({color:0x2f5a2c}),900);let tc=0;
          for(let k=0;k<3000&&tc<900;k++){const j=Math.floor(Math.random()*N),sd=Math.random()<.5?-1:1,o=12+Math.random()*70,x=PX[j]-TZ[j]*sd*o,z=PZ[j]+TX[j]*sd*o,[i,d]=nearAll(x,z);if(d<11)continue;
          const s=.8+Math.random()*1.2;D.position.set(x,terr(x,z,i,d)-.2,z);D.scale.set(s,s*(1+Math.random()*.6),s);D.rotation.y=Math.random()*6;D.updateMatrix();tm.setMatrixAt(tc++,D.matrix)}
          tm.count=tc;scene.add(tm)}

          /* gates */
          function chk(){const c=document.createElement('canvas');c.width=64;c.height=8;const x=c.getContext('2d');for(let i=0;i<16;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?'#fff':'#111';x.fillRect(i*4,j*4,4,4)}const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return t}
          function gate(i){const g=new THREE.Group(),pm=new THREE.MeshLambertMaterial({color:0xeeeeee});
          [-4.8,4.8].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.5,6,.5),pm);p.position.set(x,3,0);g.add(p)});
          const b=new THREE.Mesh(new THREE.BoxGeometry(10,1.2,.4),new THREE.MeshBasicMaterial({map:chk()}));b.position.set(0,6,0);g.add(b);
          g.position.set(PX[i],BY[i]+RP[i],PZ[i]);g.rotation.y=Y[i];scene.add(g)}
          const FIN=N-60;gate(4);gate(FIN);

          /* crowd */
          const crowd=[];
          {const bg=new THREE.CylinderGeometry(.28,.3,1.1,6),hg=new THREE.SphereGeometry(.22,6,5),hm=new THREE.MeshLambertMaterial({color:0xe8c09a}),cl=[0xe63946,0x2a9d8f,0xf4a261,0x457b9d,0xffd166,0xeeeeee,0x8e5ac8];
          [.1,.28,.5,.62,.78,.92].forEach(f=>{let si=Math.floor(f*N);if(f==.5||f==.78)si=ramps[f==.5?0:1]+6;const sp={i:si,done:0,p:[]};
          for(let k=0;k<9;k++){const j=si+Math.floor(Math.random()*20-10),sd=Math.random()<.5?-1:1,o=7+Math.random()*5,x=PX[j]-TZ[j]*sd*o,z=PZ[j]+TX[j]*sd*o,y=ground(x,z,j,o);
          const gr=new THREE.Group(),b=new THREE.Mesh(bg,new THREE.MeshLambertMaterial({color:cl[k%7]})),h=new THREE.Mesh(hg,hm);b.position.y=.55;h.position.y=1.35;gr.add(b,h);gr.position.set(x,y,z);scene.add(gr);sp.p.push({g:gr,y,ph:Math.random()*6})}
          crowd.push(sp)})}

          /* ---------- PACE NOTES ---------- */
          const notes=[];
          const lvl=A=>A>150?'Hp':A>105?'Sq':A>80?1:A>62?2:A>48?3:A>36?4:A>26?5:6;
          {const cs=[];let inC=0,st=0;for(let i=12;i<N-12;i++){const dy=Y[i+10]-Y[i-10];
          if(!inC&&Math.abs(dy)>.15){inC=1;st=i}else if(inC&&Math.abs(dy)<.07){inC=0;const a=(Y[i]-Y[st-6])*57.3;if(Math.abs(a)>=18)cs.push({s:st-5,e:i,a})}}
          for(let k=0;k<cs.length;k++){const ic=[],tx=[];let j=k;
          for(;;){const c=cs[j],l=lvl(Math.abs(c.a)),dr=c.a>0?-1:1,w=c.a>0?'left':'right';ic.push([l,dr]);tx.push(l=='Hp'?'hairpin '+w:l=='Sq'?'square '+w:w+' '+l);if(j+1<cs.length&&ic.length<3&&cs[j+1].s-c.e<55)j++;else break}
          notes.push({i:cs[k].s,t:tx.join(' into '),ic});k=j}
          ramps.forEach(r=>notes.push({i:r-8,t:'Jump! Keep it straight!',ic:[['S',0]]}));notes.push({i:FIN-120,t:'Finish ahead, flat out!',ic:[['S',0]]});notes.sort((a,b)=>a.i-b.i)}

          /* ---------- STATE ---------- */
          let S='menu',raceT=0,pen=0,penShow=0,pt,nt,noteI=0,offT=0,cT=0,finRT=0,ts=1,steerIn=0,kbS=0,shake=0,simT=0,topV=0,lastN=0,rel=0,it;
          const K={gas:0,brk:0,hb:0};
          const car={x:0,z:0,y:0,vy:0,vx:0,vz:0,yaw:0,st:0,pitch:0,roll:0,i:10,pg:0,vf:0,w:0,sus:0,susV:0,la:0,lo:0,slip:0,gear:0};
          function reset(){car.i=10;car.x=PX[10];car.z=PZ[10];car.yaw=Y[10];car.vx=car.vz=car.vy=car.vf=0;car.st=car.pitch=car.roll=car.w=car.sus=car.susV=car.la=car.lo=0;car.y=car.pg=ground(car.x,car.z,10,0);raceT=0;pen=0;noteI=0;offT=0;topV=0;crowd.forEach(c=>c.done=0)}
          reset();
          const fmt=t=>{const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+(s<10?'0':'')+s.toFixed(1)};
          function mk(l,dr){const c=document.createElement('canvas');c.width=c.height=96;const x=c.getContext('2d');
          const col={S:['#6ee05a','#35a02c'],6:['#6ee05a','#35a02c'],5:['#a4ea4e','#62c230'],4:['#f6ee5a','#dcd22e'],3:['#f8b83c','#e28c16'],2:['#f47c36','#d84c16'],1:['#f2483c','#c81e1e'],Sq:['#f2483c','#c81e1e'],Hp:['#f2483c','#c81e1e']}[l];
